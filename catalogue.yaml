- name: create catalogue server
  hosts: catalogue
  become: yes
  tasks:
    - name: disable default nodejs
      ansible.builtin.command: dnf module disable nodejs -yes
    - name: enable nodejs 20
      ansible.builtin.command: dnf module enable noejs:20 -yes
    - name: install nodejs
      ansible.builtin.package:
        name: nodejs
        state: present
    - name: create roboshop user
      ansible.builtin.user:
        name: roboshop system user
        comment: create roboshop user
        system: true
        shell: /sbin/nologin
        home: /app
    - name: remove directory if alreadyy created
      ansible.builtin.file:
        path: /app
        state: absent
    - name: create app directory
      ansible.builtin.file:
        state: present
        path: /app
    - name: delete catalogue file if present
      ansible.builtin.file:
        path: /tmp/catalogue.zip
        state: absent
    - name: download catalogue files 
      ansible.builtin.get_url:
        url: https://roboshop-artifacts.s3.amazonaws.com/catalogue-v3.zip
        dest: /tmp/catalogue.zip
    - name: copy catalgoue details
      ansible.builtin.unarchive:
        src: /tmp/catalogue.zip
        dest: /app
        remote_src: yes
    - name: install dependencies
      community.general.npm:
        path: /app
    - name: copy catalogue services
      ansible.builtin.copy:
        src: catalogue.service
        dest: /etc/systemd/system/catalogue.service
    - name: copy mongo repo
      ansible.builtin.copy:
        src: mongo.repo
        dest: /etc/yum.repos.d/mongo.repo
    - name: install mongodb
      ansible.builtin.package:
        name: mongodb-mongosh
        state: present
    - name: connect to mongodb catalogue
      ansible.builtin.command: mongosh mongodb.daws86s.fun --quiet --eval "db.getMongo().getDBNames().indexOf('catalogue')"
      register: catalogue_output
    - name: load products into mongodb
      ansible.builtin.shell: mongosh --host mongodb.daws86s.fun </app/db/master-data.js
      when: catalogue_output.stdout | int < 0
    - name: daemon reload and start services
      ansible.builtin.systemd_service:
        name: catalogue
        enabled: true
        state: started
        daemon_reload: true