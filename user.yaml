- name: create user server
  hosts: user
  become: yes
  tasks:
    - name: disable default nodejs
      ansible.builtin.command: dnf module disable nodejs -yes
    - name: enable nodejs 20
      ansbile.builtin.command: dnf module enable noejs:20 -yes
    - name: install nodejs
      ansible.builtin.package:
        name: nodejs
        state: present
    - name: create roboshop user
      ansible.builtin.user:
        name: roboshop system user
        comment: create roboshop user
        system: true
        shell: /sbin/nologin
        home: /app
    - name: remove directory if alreadyy created
      ansible.builtin.file:
        path: /app
        state: absent
    - name: create app directory
      ansible.builtin.file:
        state: present
        path: /app
    - name: delete user file if present
      ansible.builtin.file:
        path: /tmp/user.zip
        state: absent
    - name: download user files 
      ansible.builtin.get_url:
        url: https://roboshop-artifacts.s3.amazonaws.com/user-v3.zip
        dest: /tmp/user.zip
    - name: copy catalgoue details
      ansible.builtin.unarchive:
        src: /tmp/user.zip
        dest: /app
        remote_src: yes
    - name: install dependencies
      community.general.npm:
        path: /app
    - name: copy user services
      ansible.builtin.copy:
      src: user.service
      dest: /etc/systemd/system/user.service
      ansible.builtin.systemd_services:
        name: user
        enabled: true
        state: started
        daemon_reload: true