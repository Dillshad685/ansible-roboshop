- name: shipping creation
  hosts: shipping
  become: yes
  tasks:
    - name: intall maven
      ansible.builtin.dnf:
        name: "{{ item }}"
        state: present
      loop:
      - maven
      - mysql
    - name: install mysql libraries
      ansible.builtin.pip:
        executable: pip3.9
        name: "{{ item }}"
      loop:
      - cryptography
      - PyMySQL
    - name: create roboshop user
      ansible.builtin.user:
        name: roboshop
        comment: Roboshop system user
        system: true
        shell: /sbin/nologin
        home: /app
    - name: remove app directoy if exists
      ansible.builtin.file:
        name: /app
        state: absent
    - name: create app directory
      ansible.builtin.file:
        state: directory
        path: /app
    - name: Delete shipping file if exists
      ansible.builtin.file:
        path: /tmp/shipping.zip
        state: absent
    - name: download shipping code 
      ansible.builtin.get_url:
        url: https://roboshop-artifacts.s3.amazonaws.com/shipping-v3.zip
        dest: /tmp/shipping.zip
    - name: extract shipping application
      ansible.builtin.unarchive:
        src: /tmp/shipping.zip
        dest: /app
        remote_src: yes
    - name: install dependencies
      ansible.builtin.command: mvn clean package
      args:
        chdir: /app
    - name: move jar file
      ansible.builtin.command:
        mv /target/shipping-0.1.jar shipping.jar
      args:
        chdir: /app
    - name: copy shipping service
      ansible.builtin.copy:
        src: shipping.service
        dest: /etc/systemd/system/shipping.service
    - name: import shipping data into mysql
      community.mysql.mysql_db:
        state: import
        name: all
        login_host: mysql.dillshad.space
        login_user: root
        login_password: RoboShop@01
        target: "{{ item }}"
      loop:
        - /app/db/schema.sql
        - /app/db/app-user.sql 
        - /app/db/master-data.sql
    - name: daemon relad and enable
      ansible.builtin.systemd_service:
        name: shipping
        enabled: true
        state: started
        daemon_reload: true
        
       
        
